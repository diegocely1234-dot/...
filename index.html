<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Inventario Tienda · v3</title>
<script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
<style>
:root{--bg:#f4f6fa;--card:#fff;--tx:#1d2433;--mu:#6b7385;--bd:#e1e5ee;--ac:#3b6fe0;--acx:#fff;--side:#fff;--ok:#27ae60;--wn:#e67e22;--er:#c0392b;--radius:12px;--shadow:0 2px 8px rgba(20,30,60,.06)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12151c;--card:#1b2030;--tx:#e8ebf3;--mu:#98a0b3;--bd:#2b3247;--ac:#6c95f5;--acx:#0d1220;--side:#171b28;--shadow:0 2px 8px rgba(0,0,0,.3)}}
:root[data-theme="dark"]{--bg:#12151c;--card:#1b2030;--tx:#e8ebf3;--mu:#98a0b3;--bd:#2b3247;--ac:#6c95f5;--acx:#0d1220;--side:#171b28;--shadow:0 2px 8px rgba(0,0,0,.3)}
*{box-sizing:border-box}html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font:14px/1.5 system-ui,"Segoe UI",Roboto,sans-serif;display:flex;min-height:100vh;padding-top:env(safe-area-inset-top,0);padding-bottom:env(safe-area-inset-bottom,0)}
nav{width:230px;flex-shrink:0;background:var(--side);border-right:1px solid var(--bd);padding:18px 10px;display:flex;flex-direction:column;gap:2px}
nav h1{font-size:19px;margin:4px 10px 0}nav .brand small{color:var(--mu);margin:0 10px 16px;display:block;font-size:12px}
nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;color:var(--tx);padding:10px 12px;border-radius:8px;font:inherit;cursor:pointer;transition:.15s}
nav button:hover{background:var(--bg)}nav button.on{background:var(--ac);color:var(--acx);font-weight:600}
nav .sep{height:1px;background:var(--bd);margin:10px 4px}
nav .badge{margin-left:auto;background:var(--er);color:#fff;border-radius:99px;font-size:11px;padding:1px 7px;font-weight:700}
nav button.on .badge{background:rgba(0,0,0,.25)}
main{flex:1;padding:22px 28px;min-width:0}
h2{margin:0 0 4px;font-size:24px}h3{margin:18px 0 8px;font-size:16px}
.sub{color:var(--mu);margin:0 0 16px}.muted{color:var(--mu)}
input,select,textarea{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:9px 11px;width:100%;transition:.15s}
input:focus,select:focus,textarea:focus{outline:2px solid var(--ac);outline-offset:-1px;border-color:transparent}
textarea{resize:vertical;min-height:70px}
label{display:block;font-size:12px;color:var(--mu);margin-bottom:4px;font-weight:500}
.btn{background:var(--ac);color:var(--acx);border:0;border-radius:8px;padding:9px 16px;font:inherit;font-weight:600;cursor:pointer;transition:.15s;display:inline-flex;align-items:center;gap:6px}
.btn:hover{filter:brightness(.95)}.btn.g{background:var(--bd);color:var(--tx)}.btn.r{background:var(--er);color:#fff}
.btn.s{padding:6px 11px;font-size:13px}.btn:disabled{opacity:.5;cursor:not-allowed}
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--radius);padding:16px;margin-bottom:14px}
.tw{overflow-x:auto;border:1px solid var(--bd);border-radius:var(--radius);background:var(--card)}
table{border-collapse:collapse;width:100%;min-width:760px}
th{text-align:left;font-size:12px;color:var(--mu);text-transform:uppercase;letter-spacing:.04em;padding:10px 12px;border-bottom:1px solid var(--bd);white-space:nowrap}
th.sortable{cursor:pointer;user-select:none}th.sortable:hover{color:var(--tx)}
td{padding:10px 12px;border-bottom:1px solid var(--bd);vertical-align:middle}
tbody tr{cursor:pointer;transition:.1s}tbody tr:hover{background:var(--bg)}tr:last-child td{border-bottom:0}
.pill{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
.pill.hay{background:#27ae60;color:#fff}.pill.no{background:#c0392b;color:#fff}.pill.posible{background:#e67e22;color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.grid.tight{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
.mod{position:fixed;inset:0;background:rgba(10,15,30,.55);display:none;align-items:center;justify-content:center;padding:16px;z-index:100;backdrop-filter:blur(2px)}
.mod.on{display:flex}
.mod>div{background:var(--card);border-radius:14px;padding:22px;max-width:640px;width:100%;max-height:90vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.kv{display:grid;grid-template-columns:160px 1fr;gap:6px 12px;margin:8px 0}
.kv>span:nth-child(odd){color:var(--mu);font-size:13px}.kv>span:nth-child(even){font-size:13px}
.hl{background:var(--bg);border-radius:10px;padding:14px;margin-bottom:14px}
.err{color:var(--er);margin:8px 0;font-size:13px}
.toasts{position:fixed;bottom:20px;right:20px;z-index:200;display:flex;flex-direction:column;gap:8px;max-width:340px}
.toast{background:var(--card);border-left:4px solid var(--ac);border-radius:8px;padding:12px 14px;box-shadow:var(--shadow);animation:slide .2s}
.toast.ok{border-color:var(--ok)}.toast.er{border-color:var(--er)}.toast.wn{border-color:var(--wn)}
@keyframes slide{from{transform:translateX(20px);opacity:0}to{transform:translateX(0);opacity:1}}
.bar{display:flex;gap:8px;margin-bottom:12px;align-items:center;flex-wrap:wrap}
.filters{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;align-items:center}
.filters>select{width:auto;min-width:140px}
.empty{text-align:center;padding:50px 20px;color:var(--mu)}.empty .big{font-size:40px;opacity:.4;margin-bottom:8px}
.help{font-size:12px;color:var(--mu);margin-top:4px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.pcard{background:var(--card);border:1px solid var(--bd);border-radius:var(--radius);overflow:hidden;cursor:pointer;transition:.15s;display:flex;flex-direction:column;position:relative}
.pcard:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(20,30,60,.1)}
.pcard.sel{outline:2px solid var(--ac)}
.pcard .thumb{height:140px;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:44px;color:var(--mu);overflow:hidden}
.pcard .thumb img{width:100%;height:100%;object-fit:cover}
.pcard .body{padding:12px;display:flex;flex-direction:column;gap:6px;flex:1}
.pcard .name{font-weight:700;font-size:15px;line-height:1.3}
.pcard .meta{font-size:12px;color:var(--mu)}
.pcard .price{font-weight:700;font-size:16px;color:var(--ac)}
.pcard .foot{display:flex;justify-content:space-between;align-items:center;gap:6px;margin-top:auto}
.pcard .cbxTop{position:absolute;top:8px;right:8px;z-index:2;width:20px;height:20px;cursor:pointer;accent-color:var(--ac)}
.dateRow{display:flex;align-items:center;gap:12px;padding:12px;border-bottom:1px solid var(--bd);cursor:pointer}
.dateRow:last-child{border-bottom:0}.dateRow:hover{background:var(--bg)}
.dateDot{width:14px;height:14px;border-radius:50%;flex-shrink:0}
.dateLabel{font-size:12px;font-weight:600;padding:3px 10px;border-radius:99px;color:#fff;white-space:nowrap}
.priceBig{font-size:18px;font-weight:700;color:var(--ac);font-variant-numeric:tabular-nums}
.cbx{width:16px;height:16px;accent-color:var(--ac)}
details summary{cursor:pointer;padding:8px 0;font-weight:600}
@media print{nav,.toasts,.no-print{display:none!important}body{display:block;background:#fff}main{padding:0}.card,.tw{border-color:#ccc;box-shadow:none}.btn{display:none}}
@media(max-width:820px){body{flex-direction:column}nav{width:100%;flex-direction:row;overflow-x:auto;padding:8px;gap:4px;border-right:0;border-bottom:1px solid var(--bd)}nav h1,nav small,nav .sep{display:none}nav button{white-space:nowrap;width:auto}main{padding:16px}.kv{grid-template-columns:1fr}}
</style>
</head>
<body>

<nav>
  <h1>📦 Inventario</h1>
  <span class="brand"><small>Tienda física · v3</small></span>
  <button data-v="pendientes">📋 Pendientes</button>
  <button data-v="publicados">✅ Publicados</button>
  <button data-v="fechas">🗓 Precios</button>
  <div class="sep"></div>
  <button data-v="ubicaciones">📍 Ubicaciones</button>
  <button data-v="categorias">🏷 Categorías</button>
  <div class="sep"></div>
  <button data-v="config">⚙️ Configuración</button>
</nav>

<main id="m"></main>
<div class="mod" id="modal"><div id="modalC"></div></div>
<div class="toasts" id="toasts"></div>

<script>
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const nowISO = () => new Date().toISOString();

const DEFAULT_LOCATIONS = [
  {id:"L1", code:"1", name:"Vitrina",                        zone:"Mostrador",    desc:"", active:true},
  {id:"L2", code:"2", name:"Estante 1 y 2",                  zone:"Sala",         desc:"", active:true},
  {id:"L3", code:"3", name:"Estante 3, aseo",                zone:"Sala",         desc:"", active:true},
  {id:"L4", code:"4", name:"Bebidas",                        zone:"Sala",         desc:"", active:true},
  {id:"L5", code:"5", name:"Refrigerados, varios y lácteos", zone:"Refrigeración",desc:"", active:true},
];
const UNITS = ["g","kg","ml","L","und","cm","m","otro"];
const STORAGE_KEY = "inv_tienda_v3";
const OLD_KEY = "inv_tienda_v2";

let state = {
  products: [], locations: [], settings:{theme:"auto"},
  view:"pendientes",
  pen:{q:"", show:"draft"},
  pub:{q:"", loc:"", cat:"", avail:""},
  fec:{onlyPrice:true, sortDir:"asc"},  // asc = más antiguo primero
  selected:new Set(), pubSelected:new Set(),
  editing:null,
  sort:{col:"updatedAt", dir:"desc"},
};

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const p = JSON.parse(raw);
      state.products = (p.products || []).map(normalizeProduct);
      state.locations = p.locations || JSON.parse(JSON.stringify(DEFAULT_LOCATIONS));
      state.settings = Object.assign(state.settings, p.settings || {});
    } else {
      const m = tryMigrateV2();
      if(m){
        state.products = m.products;
        state.locations = m.locations;
        state.settings = Object.assign(state.settings, m.settings);
        saveState();
        setTimeout(()=>toast(`Datos migrados desde v2 · ${state.products.length} productos`,"ok",5000),400);
      } else {
        state.locations = JSON.parse(JSON.stringify(DEFAULT_LOCATIONS));
      }
    }
  }catch(e){console.warn(e);state.locations = JSON.parse(JSON.stringify(DEFAULT_LOCATIONS));}
  if(state.settings.theme !== "auto") document.documentElement.setAttribute("data-theme", state.settings.theme);
}
function normalizeProduct(p){
  if(!p) return p;
  if(!("priceUpdatedAt" in p)) p.priceUpdatedAt = p.updatedAt || p.createdAt || null;
  return p;
}
function saveState(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify({products:state.products, locations:state.locations, settings:state.settings})); }
  catch(e){ toast("No se pudo guardar","er"); }
}
function tryMigrateV2(){
  const raw = localStorage.getItem(OLD_KEY);
  if(!raw) return null;
  try{
    const old = JSON.parse(raw);
    if(!old.products) return null;
    const locs = (old.locations||DEFAULT_LOCATIONS).map(l=>({id:l.id,code:l.code||"",name:l.name||"",zone:l.zone||"",desc:l.desc||"",active:l.active!==false}));
    const products = old.products.map(p=>{
      const parsed = parsePresentation(p.presentation);
      const priceVal = p.sale != null ? p.sale : null;
      return {
        id: uid(), code: p.code||"", name: p.name||"",
        brand: p.brand||"", category: p.category||"",
        size: parsed.size, unit: parsed.unit || p.unit || "",
        price: priceVal,
        available: (p.qty > 0) ? "hay" : "no",
        loc: p.loc || "", image: p.photo || "", notes: p.notes || "",
        status: "draft",
        createdAt: p.createdAt || nowISO(),
        updatedAt: p.updatedAt || nowISO(),
        priceUpdatedAt: priceVal != null ? (p.updatedAt || p.createdAt || nowISO()) : null,
      };
    });
    return { products, locations: locs, settings:{theme:(old.settings&&old.settings.theme)||"auto"} };
  }catch(e){ return null; }
}
function parsePresentation(str){
  if(!str) return {size:null, unit:""};
  const m = String(str).match(/^\s*([\d.,]+)\s*([a-zA-Záéíóú]+)?\s*$/);
  if(!m) return {size:null, unit:""};
  const num = Number(String(m[1]).replace(",","."));
  let unit = (m[2]||"").toLowerCase();
  if(["litro","litros","lt","l"].includes(unit)) unit = "L";
  if(["kilos","kilo"].includes(unit)) unit = "kg";
  if(["unidad","unidades","u"].includes(unit)) unit = "und";
  if(["mililitros","ml"].includes(unit)) unit = "ml";
  if(["gramos","g"].includes(unit)) unit = "g";
  if(!UNITS.includes(unit)) unit = unit || "";
  return {size: isNaN(num) ? null : num, unit};
}
function fmtMoney(v){ if(v==null||isNaN(v)) return "—"; return "$"+Math.round(v).toLocaleString("es-CO"); }
function fmtSize(p){
  if(p.size == null || p.size === "") return p.unit || "—";
  return `${p.size} ${p.unit||""}`.trim();
}
function locName(id){ const l = state.locations.find(x=>x.id===id); return l ? l.name : "Sin ubicación"; }
function categoriesList(){
  const s = new Set();
  state.products.forEach(p=>{ if(p.category) s.add(p.category); });
  return Array.from(s).sort((a,b)=>a.localeCompare(b,"es"));
}
function availLabel(v){ return v==="hay"?"Hay": v==="no"?"No hay": v==="posible"?"Posible":"—"; }
function availPill(v){ return `<span class="pill ${esc(v||'')}">${esc(availLabel(v))}</span>`; }
function initials(name){ return (name||"?").trim().split(/\s+/).map(w=>w[0]).slice(0,2).join("").toUpperCase()||"?"; }

function daysSince(iso){
  if(!iso) return null;
  return Math.floor((Date.now() - new Date(iso).getTime())/86400000);
}
function priceColor(iso){
  if(!iso) return "#95a5a6";
  const d = daysSince(iso);
  // 0 días → verde, 180+ días → rojo
  const t = Math.min(Math.max(d,0)/180, 1);
  const hue = 140 * (1 - t);
  return `hsl(${hue}, 65%, 45%)`;
}
function priceLabel(iso){
  const d = daysSince(iso);
  if(d == null) return "Sin fecha";
  if(d <= 0) return "Hoy";
  if(d === 1) return "Ayer";
  if(d < 7) return `${d} días`;
  if(d < 30) return `${Math.floor(d/7)} sem.`;
  if(d < 365) return `${Math.floor(d/30)} meses`;
  return `${Math.floor(d/365)} año(s)`;
}

function toast(msg, type="", ms=2600){
  const div = document.createElement("div");
  div.className = "toast "+type; div.textContent = msg;
  $("#toasts").appendChild(div);
  setTimeout(()=>{div.style.opacity="0";div.style.transform="translateX(20px)";}, ms-200);
  setTimeout(()=>div.remove(), ms);
}
function openModal(html){ $("#modalC").innerHTML = html; $("#modal").classList.add("on"); }
function closeModal(){ $("#modal").classList.remove("on"); $("#modalC").innerHTML = ""; }
$("#modal").addEventListener("click", e=>{ if(e.target.id==="modal") closeModal(); });
function confirmDlg(title, msg, onYes){
  openModal(`
    <h3 style="margin-top:0">${esc(title)}</h3>
    <p class="sub">${esc(msg)}</p>
    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:18px">
      <button class="btn g" id="cNo">Cancelar</button>
      <button class="btn" id="cYes">Sí, continuar</button>
    </div>`);
  $("#cNo").onclick = closeModal;
  $("#cYes").onclick = ()=>{ closeModal(); onYes(); };
}

function go(view, opts={}){
  state.view = view;
  if(opts.editing !== undefined) state.editing = opts.editing;
  if(view !== "form") state.editing = null;
  render();
}
function render(){
  const drafts = state.products.filter(p=>p.status==="draft").length;
  $$("nav button").forEach(b=>{
    b.classList.toggle("on", b.dataset.v === state.view);
    if(b.dataset.v === "pendientes"){
      b.innerHTML = `📋 Pendientes ${drafts ? `<span class="badge">${drafts}</span>` : ""}`;
    }
  });
  const views = { pendientes:vPendientes, publicados:vPublicados, fechas:vFechas, ubicaciones:vUbicaciones, categorias:vCategorias, config:vConfig, form:vForm };
  (views[state.view] || vPendientes)();
  window.scrollTo({top:0, behavior:"instant"});
}

/* ==== PENDIENTES ==== */
function vPendientes(){
  const showAll = state.pen.show === "all";
  let list = state.products.filter(p=> showAll || p.status==="draft");
  const q = state.pen.q.toLowerCase().trim();
  if(q) list = list.filter(p => [p.code,p.name,p.brand,p.category,locName(p.loc)].join(" ").toLowerCase().includes(q));
  const {col, dir} = state.sort;
  const mul = dir === "asc" ? 1 : -1;
  list = list.slice().sort((a,b)=>{
    let va, vb;
    if(col === "loc"){ va = locName(a.loc); vb = locName(b.loc); }
    else if(col === "price"){ va = a.price ?? -Infinity; vb = b.price ?? -Infinity; }
    else { va = (a[col]||"").toString().toLowerCase(); vb = (b[col]||"").toString().toLowerCase(); }
    if(va < vb) return -1*mul;
    if(va > vb) return 1*mul;
    return 0;
  });
  const selCount = state.selected.size;
  const pendSelected = list.filter(p=> state.selected.has(p.id) && p.status==="draft").length;

  $("#m").innerHTML = `
    <h2>Pendientes</h2>
    <p class="sub">Productos en preparación. Marca los que estén listos y publícalos.</p>
    <div class="bar">
      <input id="q" placeholder="Buscar… (Ctrl+K)" value="${esc(state.pen.q)}" style="flex:1">
      <button class="btn" id="nb">➕ Nuevo producto</button>
    </div>
    <div class="filters">
      <select id="show">
        <option value="draft" ${!showAll?"selected":""}>Solo pendientes</option>
        <option value="all" ${showAll?"selected":""}>Todos (incluye publicados)</option>
      </select>
      <button class="btn g s" id="selAll">Seleccionar todo</button>
      <button class="btn g s" id="selNone">Limpiar</button>
      <span class="muted" style="margin-left:auto">${list.length} producto(s)</span>
    </div>
    ${selCount ? `<div class="card" style="display:flex;align-items:center;gap:12px;background:var(--ac);color:var(--acx);border-color:transparent">
        <b>${selCount} seleccionado(s)</b><span style="flex:1"></span>
        <button class="btn" id="publishSel" style="background:#fff;color:var(--ac)">✅ Publicar ${pendSelected}</button>
      </div>` : ""}
    <div class="tw">
      <table>
        <thead><tr>
          <th style="width:36px"><input type="checkbox" class="cbx" id="hdrCbx"></th>
          <th class="sortable" data-sort="code">Código</th>
          <th class="sortable" data-sort="name">Nombre</th>
          <th class="sortable" data-sort="brand">Marca</th>
          <th>Tamaño</th>
          <th class="sortable" data-sort="price">Precio</th>
          <th>Hay</th>
          <th class="sortable" data-sort="loc">Ubicación</th>
          <th>Estado</th>
        </tr></thead>
        <tbody id="tb"></tbody>
      </table>
    </div>`;

  const renderRows = ()=>{
    $("#tb").innerHTML = list.length === 0
      ? `<tr><td colspan="9"><div class="empty"><div class="big">📋</div>Sin productos pendientes</div></td></tr>`
      : list.map(p=>{
          const missing = [];
          if(p.price == null) missing.push("precio");
          if(!p.brand) missing.push("marca");
          if(!p.loc) missing.push("ubicación");
          const isPub = p.status === "published";
          return `<tr data-id="${esc(p.id)}">
            <td onclick="event.stopPropagation()"><input type="checkbox" class="cbx rowCbx" data-id="${esc(p.id)}" ${state.selected.has(p.id)?"checked":""}></td>
            <td>${esc(p.code)}</td>
            <td><b>${esc(p.name)}</b>${missing.length?`<div class="help">⚠ Falta: ${esc(missing.join(", "))}</div>`:""}</td>
            <td>${esc(p.brand||"—")}</td>
            <td>${esc(fmtSize(p))}</td>
            <td>${fmtMoney(p.price)}</td>
            <td>${availPill(p.available)}</td>
            <td>${esc(locName(p.loc))}</td>
            <td>${isPub?`<span class="pill" style="background:#27ae60;color:#fff">Publicado</span>`:`<span class="pill" style="background:#95a5a6;color:#fff">Pendiente</span>`}</td>
          </tr>`;
        }).join("");
    $$("#tb tr[data-id]").forEach(r=> r.onclick = ()=> openDetail(r.dataset.id, true));
    $$(".rowCbx").forEach(c=> c.onchange = ()=>{
      if(c.checked) state.selected.add(c.dataset.id); else state.selected.delete(c.dataset.id);
      render();
    });
    const hdr = $("#hdrCbx");
    if(hdr){
      hdr.checked = list.length>0 && list.every(p=> state.selected.has(p.id));
      hdr.onchange = ()=>{
        if(hdr.checked) list.forEach(p=> state.selected.add(p.id));
        else list.forEach(p=> state.selected.delete(p.id));
        render();
      };
    }
    const ps = $("#publishSel");
    if(ps) ps.onclick = ()=>{
      const ids = Array.from(state.selected).filter(id=>{
        const p = state.products.find(x=>x.id===id);
        return p && p.status === "draft";
      });
      if(!ids.length){ toast("Nada que publicar","wn"); return; }
      ids.forEach(id=>{
        const p = state.products.find(x=>x.id===id);
        if(p){ p.status = "published"; p.updatedAt = nowISO(); }
      });
      state.selected.clear(); saveState(); render();
      toast(`${ids.length} producto(s) publicados`,"ok");
    };
  };
  renderRows();

  $("#q").oninput = e=>{ state.pen.q = e.target.value; renderRows(); };
  $("#show").onchange = e=>{ state.pen.show = e.target.value; render(); };
  $("#nb").onclick = ()=> go("form");
  $("#selAll").onclick = ()=>{ list.forEach(p=> state.selected.add(p.id)); render(); };
  $("#selNone").onclick = ()=>{ state.selected.clear(); render(); };
  $$("th.sortable").forEach(th=> th.onclick = ()=>{
    const col = th.dataset.sort;
    if(state.sort.col === col) state.sort.dir = state.sort.dir==="asc"?"desc":"asc";
    else state.sort = {col, dir:"asc"};
    vPendientes();
  });
}

/* ==== PUBLICADOS ==== */
function vPublicados(){
  let list = state.products.filter(p=> p.status === "published");
  const {q, loc, cat, avail} = state.pub;
  if(loc) list = list.filter(p=> p.loc === loc);
  if(cat) list = list.filter(p=> (p.category||"") === cat);
  if(avail) list = list.filter(p=> p.available === avail);
  if(q){
    const ql = q.toLowerCase();
    list = list.filter(p=> [p.code,p.name,p.brand,p.category,locName(p.loc),fmtSize(p)].join(" ").toLowerCase().includes(ql));
  }
  const cats = categoriesList();
  const selCount = state.pubSelected.size;

  const selectedList = Array.from(state.pubSelected)
    .map(id => state.products.find(p=> p.id === id))
    .filter(Boolean);
  const withPrice = selectedList.filter(p=> p.price != null);
  const totalSel = withPrice.reduce((s,p)=> s + Number(p.price||0), 0);
  const avgSel = withPrice.length ? totalSel / withPrice.length : 0;
  const countBy = {hay:0, no:0, posible:0};
  selectedList.forEach(p=> { if(p.available in countBy) countBy[p.available]++; });
  const totalBy = {hay:0, no:0, posible:0};
  selectedList.forEach(p=> { if(p.available in totalBy && p.price != null) totalBy[p.available] += Number(p.price); });

  $("#m").innerHTML = `
    <h2>Publicados</h2>
    <p class="sub">Catálogo final. Busca y filtra por ubicación o categoría.</p>
    <div class="bar">
      <input id="q" placeholder="Buscar por nombre, marca, tamaño… (Ctrl+K)" value="${esc(q)}" style="flex:1">
    </div>
    <div class="filters">
      <select id="fLoc"><option value="">Todas las ubicaciones</option>
        ${state.locations.map(l=>`<option value="${esc(l.id)}" ${loc===l.id?"selected":""}>${esc(l.name)}</option>`).join("")}</select>
      <select id="fCat"><option value="">Todas las categorías</option>
        ${cats.map(c=>`<option value="${esc(c)}" ${cat===c?"selected":""}>${esc(c)}</option>`).join("")}</select>
      <select id="fAv"><option value="">Hay / No hay / Posible</option>
        <option value="hay" ${avail==="hay"?"selected":""}>Hay</option>
        <option value="no" ${avail==="no"?"selected":""}>No hay</option>
        <option value="posible" ${avail==="posible"?"selected":""}>Posible</option></select>
      <button class="btn g s" id="clear">Limpiar</button>
      <span class="muted" style="margin-left:auto">${list.length} producto(s) visibles</span>
    </div>

    ${selCount ? `
      <div class="card" style="background:linear-gradient(135deg,var(--ac),#5a8af0);color:#fff;border:0">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap">
          <div style="flex:1;min-width:200px">
            <div style="font-size:11px;opacity:.85;text-transform:uppercase;letter-spacing:.06em;font-weight:700">🧮 Calculadora de selección</div>
            <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:14px;margin-top:10px">
              <div>
                <div style="font-size:11px;opacity:.8">Productos</div>
                <div style="font-size:24px;font-weight:700;line-height:1.1">${selCount}</div>
              </div>
              <div>
                <div style="font-size:11px;opacity:.8">Suma total</div>
                <div style="font-size:24px;font-weight:700;line-height:1.1">${fmtMoney(totalSel)}</div>
              </div>
              <div>
                <div style="font-size:11px;opacity:.8">Precio promedio</div>
                <div style="font-size:24px;font-weight:700;line-height:1.1">${fmtMoney(avgSel)}</div>
              </div>
              <div>
                <div style="font-size:11px;opacity:.8">Con precio</div>
                <div style="font-size:24px;font-weight:700;line-height:1.1">${withPrice.length}/${selCount}</div>
              </div>
            </div>
            <div style="display:flex;gap:14px;margin-top:10px;font-size:12px;flex-wrap:wrap;opacity:.95">
              ${countBy.hay?`<span>✅ Hay: <b>${countBy.hay}</b> · ${fmtMoney(totalBy.hay)}</span>`:""}
              ${countBy.posible?`<span>⚠ Posible: <b>${countBy.posible}</b> · ${fmtMoney(totalBy.posible)}</span>`:""}
              ${countBy.no?`<span>❌ No hay: <b>${countBy.no}</b> · ${fmtMoney(totalBy.no)}</span>`:""}
            </div>
          </div>
          <div style="display:flex;gap:8px;flex-wrap:wrap">
            <button class="btn" id="clearSel" style="background:rgba(255,255,255,.22);color:#fff">Limpiar</button>
            <button class="btn" id="unpubSel" style="background:#fff;color:var(--ac)">↩ Enviar a pendientes</button>
          </div>
        </div>
        <details style="margin-top:12px">
          <summary style="cursor:pointer;font-size:13px;font-weight:600;color:#fff">Ver desglose de ${selCount} producto(s)</summary>
          <div style="margin-top:8px;background:rgba(0,0,0,.15);border-radius:8px;max-height:260px;overflow:auto">
            <table style="width:100%;min-width:0;color:#fff">
              <thead><tr>
                <th style="color:rgba(255,255,255,.75);border-color:rgba(255,255,255,.15);font-size:11px">Producto</th>
                <th style="color:rgba(255,255,255,.75);border-color:rgba(255,255,255,.15);font-size:11px">Marca</th>
                <th style="color:rgba(255,255,255,.75);border-color:rgba(255,255,255,.15);font-size:11px">Hay</th>
                <th style="color:rgba(255,255,255,.75);border-color:rgba(255,255,255,.15);font-size:11px;text-align:right">Precio</th>
              </tr></thead>
              <tbody>
                ${selectedList.map(p=>`<tr>
                  <td style="border-color:rgba(255,255,255,.12);font-size:13px">${esc(p.name)}</td>
                  <td style="border-color:rgba(255,255,255,.12);font-size:13px;opacity:.85">${esc(p.brand||"—")}</td>
                  <td style="border-color:rgba(255,255,255,.12);font-size:13px">${esc(availLabel(p.available))}</td>
                  <td style="border-color:rgba(255,255,255,.12);font-size:13px;text-align:right;font-weight:600;font-variant-numeric:tabular-nums">${fmtMoney(p.price)}</td>
                </tr>`).join("")}
                <tr style="background:rgba(0,0,0,.18)">
                  <td colspan="3" style="border:0;font-weight:700">Total (${withPrice.length} con precio)</td>
                  <td style="border:0;text-align:right;font-weight:700;font-size:15px">${fmtMoney(totalSel)}</td>
                </tr>
              </tbody>
            </table>
          </div>
        </details>
      </div>
    ` : ""}

    ${list.length === 0 ? `<div class="empty"><div class="big">✅</div>Sin productos publicados con esos filtros.</div>` : `
      <div class="cards">
        ${list.map(p=>`
          <div class="pcard ${state.pubSelected.has(p.id)?"sel":""}" data-id="${esc(p.id)}">
            <input type="checkbox" class="cbxTop" data-id="${esc(p.id)}" ${state.pubSelected.has(p.id)?"checked":""}>
            <div class="thumb">${p.image ? `<img src="${esc(p.image)}" alt="" onerror="this.style.display='none';this.parentNode.textContent='${esc(initials(p.name))}'">` : esc(initials(p.name))}</div>
            <div class="body">
              <div class="name">${esc(p.name)}</div>
              <div class="meta">${esc(p.brand||"Sin marca")} · ${esc(fmtSize(p))}</div>
              <div class="price">${fmtMoney(p.price)}</div>
              <div class="foot">
                ${availPill(p.available)}
                <span class="meta" title="${esc(locName(p.loc))}">📍 ${esc(locName(p.loc))}</span>
              </div>
            </div>
          </div>`).join("")}
      </div>`}
  `;
  $("#q").oninput = e=>{ state.pub.q = e.target.value; vPublicados(); };
  $("#fLoc").onchange = e=>{ state.pub.loc = e.target.value; vPublicados(); };
  $("#fCat").onchange = e=>{ state.pub.cat = e.target.value; vPublicados(); };
  $("#fAv").onchange = e=>{ state.pub.avail = e.target.value; vPublicados(); };
  $("#clear").onclick = ()=>{ state.pub = {q:"",loc:"",cat:"",avail:""}; vPublicados(); };
  $$(".pcard[data-id]").forEach(c=> c.onclick = e=>{
    if(e.target.classList.contains("cbxTop")) return;
    openDetail(c.dataset.id, false);
  });
  $$(".cbxTop").forEach(cb=> cb.onchange = ()=>{
    if(cb.checked) state.pubSelected.add(cb.dataset.id);
    else state.pubSelected.delete(cb.dataset.id);
    vPublicados();
  });
  const cs = $("#clearSel");
  if(cs) cs.onclick = ()=>{ state.pubSelected.clear(); vPublicados(); };
  const us = $("#unpubSel");
  if(us) us.onclick = ()=>{
    confirmDlg("Enviar a pendientes", `¿Enviar ${selCount} producto(s) de vuelta a pendientes?`, ()=>{
      state.pubSelected.forEach(id=>{
        const p = state.products.find(x=>x.id===id);
        if(p){ p.status = "draft"; p.updatedAt = nowISO(); }
      });
      state.pubSelected.clear(); saveState(); render();
      toast("Enviados a pendientes","wn");
    });
  };
}

/* ==== PRECIOS (antes Fechas) ==== */
function vFechas(){
  const {onlyPrice, sortDir} = state.fec;
  let list = state.products.slice();
  if(onlyPrice) list = list.filter(p=> p.price != null);
  // Ordena por priceUpdatedAt (nulls al final)
  list.sort((a,b)=>{
    const av = a.priceUpdatedAt || "";
    const bv = b.priceUpdatedAt || "";
    if(!av && !bv) return 0;
    if(!av) return 1;
    if(!bv) return -1;
    return sortDir === "asc" ? av.localeCompare(bv) : bv.localeCompare(av);
  });

  // Métricas rápidas
  const conPrecio = state.products.filter(p=> p.price != null);
  const sinPrecio = state.products.filter(p=> p.price == null);
  const viejos = conPrecio.filter(p=> {
    const d = daysSince(p.priceUpdatedAt);
    return d != null && d >= 60;
  });
  const muyViejos = conPrecio.filter(p=> {
    const d = daysSince(p.priceUpdatedAt);
    return d != null && d >= 180;
  });

  $("#m").innerHTML = `
    <h2>Precios</h2>
    <p class="sub">Última vez que se cambió el <b>precio</b> de cada producto. Verde = reciente, rojo = antiguo.</p>

    <div class="card" style="display:flex;gap:16px;align-items:center;flex-wrap:wrap">
      <span class="muted" style="font-size:12px">Antigüedad del precio:</span>
      <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">
        <span class="dateLabel" style="background:${priceColor(nowISO())}">Reciente</span>
        <span class="dateLabel" style="background:${priceColor(new Date(Date.now()-60*86400000).toISOString())}">2 meses</span>
        <span class="dateLabel" style="background:${priceColor(new Date(Date.now()-120*86400000).toISOString())}">4 meses</span>
        <span class="dateLabel" style="background:${priceColor(new Date(Date.now()-180*86400000).toISOString())}">6+ meses</span>
      </div>
    </div>

    <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px">
      <div class="card" style="margin:0;border-left:4px solid var(--ac)">
        <div class="muted" style="font-size:11px;text-transform:uppercase;letter-spacing:.04em">Con precio</div>
        <div style="font-size:22px;font-weight:700">${conPrecio.length}</div>
      </div>
      <div class="card" style="margin:0;border-left:4px solid var(--wn)">
        <div class="muted" style="font-size:11px;text-transform:uppercase;letter-spacing:.04em">+60 días sin cambiar</div>
        <div style="font-size:22px;font-weight:700">${viejos.length}</div>
      </div>
      <div class="card" style="margin:0;border-left:4px solid var(--er)">
        <div class="muted" style="font-size:11px;text-transform:uppercase;letter-spacing:.04em">+180 días sin cambiar</div>
        <div style="font-size:22px;font-weight:700">${muyViejos.length}</div>
      </div>
      <div class="card" style="margin:0;border-left:4px solid var(--mu)">
        <div class="muted" style="font-size:11px;text-transform:uppercase;letter-spacing:.04em">Sin precio</div>
        <div style="font-size:22px;font-weight:700">${sinPrecio.length}</div>
      </div>
    </div>

    <div class="filters" style="margin-top:14px">
      <label style="display:flex;align-items:center;gap:8px;color:var(--tx);font-size:13px;margin:0;cursor:pointer">
        <input type="checkbox" id="onlyPrice" ${onlyPrice?"checked":""} style="width:auto;accent-color:var(--ac)">
        Solo productos con precio
      </label>
      <select id="sortDir" style="width:auto;min-width:180px">
        <option value="asc" ${sortDir==="asc"?"selected":""}>Más antiguos primero</option>
        <option value="desc" ${sortDir==="desc"?"selected":""}>Más recientes primero</option>
      </select>
      <span class="muted" style="margin-left:auto">${list.length} producto(s)</span>
    </div>

    <div class="card" style="padding:0">
      ${list.length === 0 ? `<div class="empty"><div class="big">🏷</div>Sin productos que mostrar</div>` : list.map(p=>{
        const c = priceColor(p.priceUpdatedAt);
        const d = daysSince(p.priceUpdatedAt);
        const dTxt = d == null ? "Sin fecha" : (d <= 0 ? "Hoy" : d === 1 ? "Ayer" : `Hace ${d} día${d===1?"":"s"}`);
        const warning = d != null && d >= 180 ? "⚠ " : d != null && d >= 60 ? "· " : "";
        return `<div class="dateRow" data-id="${esc(p.id)}">
          <span class="dateDot" style="background:${c}"></span>
          <div style="flex:1;min-width:0">
            <div><b>${esc(p.name)}</b> <span class="muted" style="font-size:12px">· ${esc(p.code||"s/c")}</span></div>
            <div class="muted" style="font-size:12px">${esc(p.brand||"Sin marca")} · ${esc(fmtSize(p))} · 📍 ${esc(locName(p.loc))}</div>
          </div>
          <span class="priceBig">${fmtMoney(p.price)}</span>
          <span class="dateLabel" style="background:${c}">${warning}${esc(dTxt)}</span>
          <span class="muted" style="font-size:12px;min-width:120px;text-align:right">${p.priceUpdatedAt?new Date(p.priceUpdatedAt).toLocaleDateString("es-CO",{day:"2-digit",month:"short",year:"numeric"}):"—"}</span>
        </div>`;
      }).join("")}
    </div>
    <p class="help" style="margin-top:10px">El color y el tiempo se cuentan desde la última vez que <b>cambió el precio</b>, no desde la última edición del producto.</p>`;

  $("#onlyPrice").onchange = e=>{ state.fec.onlyPrice = e.target.checked; vFechas(); };
  $("#sortDir").onchange = e=>{ state.fec.sortDir = e.target.value; vFechas(); };
  $$(".dateRow[data-id]").forEach(r=> r.onclick = ()=> openDetail(r.dataset.id, false));
}

/* ==== UBICACIONES ==== */
function vUbicaciones(){
  const rows = state.locations.map(l=>{
    const n = state.products.filter(p=> p.loc === l.id).length;
    const pub = state.products.filter(p=> p.loc === l.id && p.status === "published").length;
    return `<tr data-loc="${esc(l.id)}">
      <td>${esc(l.code||"—")}</td>
      <td><b>${esc(l.name)}</b></td>
      <td>${esc(l.zone||"—")}</td>
      <td>${n}</td>
      <td>${pub}</td>
      <td>${l.active?"✅":"⛔"}</td>
    </tr>`;
  }).join("");
  $("#m").innerHTML = `
    <h2>Ubicaciones</h2>
    <p class="sub">Zonas físicas donde se guardan los productos.</p>
    <div class="bar"><button class="btn" id="add">➕ Nueva ubicación</button></div>
    <div class="tw"><table>
      <thead><tr><th>Código</th><th>Nombre</th><th>Zona</th><th>Productos</th><th>Publicados</th><th>Activa</th></tr></thead>
      <tbody>${rows || `<tr><td colspan="6"><div class="empty">Sin ubicaciones</div></td></tr>`}</tbody>
    </table></div>`;
  $("#add").onclick = ()=> editLocation(null);
  $$("[data-loc]").forEach(r=> r.onclick = ()=> editLocation(r.dataset.loc));
}
function editLocation(id){
  const l = id ? state.locations.find(x=>x.id===id) : {id:"",code:"",name:"",zone:"",desc:"",active:true};
  const isNew = !id;
  openModal(`
    <h3 style="margin-top:0">${isNew?"Nueva ubicación":"Editar ubicación"}</h3>
    <div class="grid" style="margin-top:12px">
      <div><label>Código / Número</label><input id="l_code" value="${esc(l.code)}"></div>
      <div><label>Nombre *</label><input id="l_name" value="${esc(l.name)}"></div>
      <div><label>Zona o tipo</label><input id="l_zone" value="${esc(l.zone)}"></div>
    </div>
    <div style="margin-top:12px"><label>Descripción</label><textarea id="l_desc">${esc(l.desc)}</textarea></div>
    <label style="display:flex;align-items:center;gap:8px;margin-top:12px;color:var(--tx)">
      <input type="checkbox" id="l_active" ${l.active?"checked":""} style="width:auto"> Ubicación activa
    </label>
    <div class="err" id="lerr"></div>
    <div style="display:flex;gap:8px;justify-content:space-between;margin-top:16px">
      <div>${!isNew?`<button class="btn r s" id="lDel">🗑 Eliminar</button>`:""}</div>
      <div style="display:flex;gap:8px">
        <button class="btn g" id="lCancel">Cancelar</button>
        <button class="btn" id="lSave">Guardar</button>
      </div>
    </div>`);
  $("#lCancel").onclick = closeModal;
  if(!isNew) $("#lDel").onclick = ()=>{
    const count = state.products.filter(p=> p.loc === id).length;
    confirmDlg("Eliminar ubicación", count ? `Hay ${count} producto(s) aquí. Se quedarán sin ubicación. ¿Eliminar?` : "¿Eliminar esta ubicación?", ()=>{
      state.locations = state.locations.filter(x=> x.id !== id);
      state.products.forEach(p=>{ if(p.loc === id) p.loc = ""; });
      saveState(); closeModal(); render(); toast("Ubicación eliminada","wn");
    });
  };
  $("#lSave").onclick = ()=>{
    const name = $("#l_name").value.trim();
    if(!name){ $("#lerr").textContent = "El nombre es obligatorio."; return; }
    const data = { code:$("#l_code").value.trim(), name, zone:$("#l_zone").value.trim(), desc:$("#l_desc").value.trim(), active:$("#l_active").checked };
    if(isNew){ data.id = uid(); state.locations.push(data); toast("Ubicación creada","ok"); }
    else { Object.assign(l, data); toast("Ubicación actualizada","ok"); }
    saveState(); closeModal(); render();
  };
}

/* ==== CATEGORÍAS ==== */
function vCategorias(){
  const cats = categoriesList();
  const rows = cats.map(c=>{
    const items = state.products.filter(p=> p.category === c);
    const pub = items.filter(p=> p.status === "published").length;
    return `<tr data-cat="${esc(c)}">
      <td><b>${esc(c)}</b></td>
      <td>${items.length}</td>
      <td>${pub}</td>
      <td>${state.locations.filter(l=> items.some(p=> p.loc === l.id)).length}</td>
    </tr>`;
  }).join("");
  $("#m").innerHTML = `
    <h2>Categorías</h2>
    <p class="sub">Se generan automáticamente desde los productos.</p>
    <div class="tw"><table>
      <thead><tr><th>Categoría</th><th>Productos</th><th>Publicados</th><th>Ubicaciones</th></tr></thead>
      <tbody>${rows || `<tr><td colspan="4"><div class="empty">Sin categorías</div></td></tr>`}</tbody>
    </table></div>`;
  $$("[data-cat]").forEach(r=> r.onclick = ()=>{
    const c = r.dataset.cat;
    openModal(`
      <h3 style="margin-top:0">${esc(c)}</h3>
      <p class="sub">${state.products.filter(p=>p.category===c).length} producto(s)</p>
      <div><label>Renombrar a</label><input id="cRename" value="${esc(c)}"></div>
      <div class="err" id="cErr"></div>
      <div style="display:flex;gap:8px;justify-content:space-between;margin-top:16px">
        <button class="btn r s" id="cDel">🗑 Quitar de productos</button>
        <div style="display:flex;gap:8px">
          <button class="btn g" id="cCancel">Cancelar</button>
          <button class="btn" id="cOk">Guardar</button>
        </div>
      </div>`);
    $("#cCancel").onclick = closeModal;
    $("#cOk").onclick = ()=>{
      const nn = $("#cRename").value.trim();
      if(!nn){ $("#cErr").textContent = "Escribe un nombre."; return; }
      state.products.forEach(p=>{ if(p.category === c) p.category = nn; });
      saveState(); closeModal(); render(); toast("Categoría renombrada","ok");
    };
    $("#cDel").onclick = ()=>{
      confirmDlg("Quitar categoría", `Se quitará "${c}" de ${state.products.filter(p=>p.category===c).length} producto(s).`, ()=>{
        state.products.forEach(p=>{ if(p.category === c) p.category = ""; });
        saveState(); closeModal(); render(); toast("Categoría eliminada","wn");
      });
    };
  });
}

/* ==== DETALLE ==== */
function openDetail(id, editable){
  const p = state.products.find(x=>x.id===id);
  if(!p) return;
  const kv = (k,v) => `<span>${k}</span><span>${v == null || v === "" ? `<i style="color:var(--mu)">—</i>` : esc(v)}</span>`;
  const d = daysSince(p.priceUpdatedAt);
  const dTxt = p.price == null ? "Sin precio" : (d == null ? "Sin fecha" : (d <= 0 ? "Hoy" : d === 1 ? "Ayer" : `Hace ${d} día(s)`));
  openModal(`
    <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px">
      <div>
        <h3 style="margin:0;font-size:20px">${esc(p.name)}</h3>
        <div class="muted" style="font-size:13px;margin-top:2px">Código ${esc(p.code||"—")}</div>
      </div>
      <button class="btn g s" id="dClose">✕</button>
    </div>
    ${p.image?`<div style="margin-top:12px;text-align:center"><img src="${esc(p.image)}" alt="" style="max-width:100%;max-height:240px;border-radius:10px" onerror="this.style.display='none'"></div>`:""}
    <div class="hl" style="margin-top:14px">
      <div class="kv">
        ${kv("📍 Ubicación", locName(p.loc))}
        ${kv("💲 Precio", fmtMoney(p.price))}
        ${kv("📏 Tamaño", fmtSize(p))}
        ${kv("🏷 Marca", p.brand)}
        <span>📊 Disponibilidad</span><span>${availPill(p.available)}</span>
        <span>Estado</span><span>${p.status==="published"?`<span class="pill" style="background:#27ae60;color:#fff">Publicado</span>`:`<span class="pill" style="background:#95a5a6;color:#fff">Pendiente</span>`}</span>
      </div>
    </div>
    <div class="kv">
      ${kv("Categoría", p.category)}
      ${kv("Notas", p.notes)}
      ${kv("Precio actualizado", p.priceUpdatedAt ? `${new Date(p.priceUpdatedAt).toLocaleString("es-CO")} (${dTxt})` : dTxt)}
      ${kv("Creado", p.createdAt?new Date(p.createdAt).toLocaleString("es-CO"):null)}
    </div>
    <div style="display:flex;gap:8px;justify-content:space-between;margin-top:18px">
      <div style="display:flex;gap:8px">
        ${editable?`<button class="btn" id="dEdit">✏️ Editar</button>`:""}
        ${editable?`<button class="btn r" id="dDel">🗑 Eliminar</button>`:""}
      </div>
      <button class="btn g" id="dOk">Cerrar</button>
    </div>`);
  $("#dClose").onclick = closeModal;
  $("#dOk").onclick = closeModal;
  if(editable){
    $("#dEdit").onclick = ()=>{ closeModal(); go("form",{editing:id}); };
    $("#dDel").onclick = ()=>{ closeModal(); askDeleteProduct(id); };
  }
}
function askDeleteProduct(id){
  const p = state.products.find(x=>x.id===id);
  if(!p) return;
  confirmDlg("Eliminar producto", `¿Eliminar "${p.name}"?`, ()=>{
    state.products = state.products.filter(x=> x.id !== id);
    state.selected.delete(id); state.pubSelected.delete(id);
    saveState(); render(); toast("Producto eliminado","wn");
  });
}

/* ==== FORM ==== */
function vForm(){
  const editing = state.editing ? state.products.find(x=>x.id===state.editing) : null;
  const p = editing || { code:"", name:"", brand:"", category:"", size:"", unit:"", price:"", available:"hay", loc:"", image:"", notes:"" };
  const F = (k, label, type="text", opts={}) => `
    <div>
      <label>${esc(label)}${opts.req?" *":""}</label>
      <input id="f_${k}" type="${type}" value="${esc(p[k] ?? "")}"
        ${opts.step?`step="${opts.step}"`:""} ${opts.min!=null?`min="${opts.min}"`:""}
        ${opts.placeholder?`placeholder="${esc(opts.placeholder)}"`:""}>
    </div>`;
  const priceInfo = editing && editing.price != null && editing.priceUpdatedAt
    ? `<p class="help">Último cambio de precio: ${new Date(editing.priceUpdatedAt).toLocaleString("es-CO")} · ${priceLabel(editing.priceUpdatedAt)}</p>`
    : "";
  $("#m").innerHTML = `
    <h2>${editing?"Editar producto":"Nuevo producto"}</h2>
    <p class="sub">${editing?`Editando: ${esc(p.name)}`:"Los campos con * son obligatorios. Se guardará como pendiente."}</p>

    <div class="card">
      <h3 style="margin-top:0">Identificación</h3>
      <div class="grid">
        ${F("code","Código interno","text",{placeholder:"A001"})}
        ${F("name","Nombre del producto *","text",{req:true})}
        ${F("brand","Marca / Empresa")}
        <div>
          <label>Categoría</label>
          <input id="f_category" list="catList" value="${esc(p.category||"")}">
          <datalist id="catList">${categoriesList().map(c=>`<option value="${esc(c)}">`).join("")}</datalist>
        </div>
      </div>
    </div>

    <div class="card">
      <h3 style="margin-top:0">Tamaño / presentación</h3>
      <div class="grid tight">
        ${F("size","Cantidad","number",{min:0,step:"any",placeholder:"500"})}
        <div>
          <label>Unidad</label>
          <select id="f_unit"><option value="">—</option>
            ${UNITS.map(u=>`<option value="${esc(u)}" ${u===p.unit?"selected":""}>${esc(u)}</option>`).join("")}
          </select>
        </div>
      </div>
      <p class="help">Ej.: 500 g, 1.5 L, 12 und…</p>
    </div>

    <div class="card">
      <h3 style="margin-top:0">Disponibilidad y precio</h3>
      <div class="grid tight">
        ${F("price","Precio de venta (COP)","number",{min:0,step:"any"})}
        <div>
          <label>¿Hay?</label>
          <select id="f_available">
            <option value="hay" ${p.available==="hay"?"selected":""}>Hay</option>
            <option value="no" ${p.available==="no"?"selected":""}>No hay</option>
            <option value="posible" ${p.available==="posible"?"selected":""}>Posible</option>
          </select>
        </div>
      </div>
      ${priceInfo}
      <p class="help">Si cambias el precio, se registrará la fecha del cambio.</p>
    </div>

    <div class="card">
      <h3 style="margin-top:0">Ubicación</h3>
      <div class="grid">
        <div>
          <label>Ubicación principal</label>
          <select id="f_loc"><option value="">Sin ubicación</option>
            ${state.locations.map(l=>`<option value="${esc(l.id)}" ${l.id===p.loc?"selected":""}>${esc(l.name)}${l.code?` (${esc(l.code)})`:""}</option>`).join("")}
          </select>
        </div>
      </div>
    </div>

    <details class="card">
      <summary>Opcional</summary>
      <div style="margin-top:12px">
        <label>URL de imagen</label>
        <input id="f_image" value="${esc(p.image||"")}" placeholder="https://…">
        <p class="help">Se mostrará en el catálogo de publicados.</p>
      </div>
      <div style="margin-top:12px"><label>Notas</label><textarea id="f_notes">${esc(p.notes||"")}</textarea></div>
    </details>

    <div class="err" id="err"></div>
    <div style="display:flex;gap:8px">
      <button class="btn" id="save">💾 Guardar</button>
      <button class="btn g" id="cancel">Cancelar</button>
      ${editing && p.status === "published" ? `<span class="muted" style="margin-left:auto;align-self:center;font-size:12px">Publicado</span>` : ""}
    </div>`;

  $("#cancel").onclick = ()=> go("pendientes");
  $("#save").onclick = ()=>{
    const err = $("#err"); err.textContent = "";
    const code = $("#f_code").value.trim();
    const name = $("#f_name").value.trim();
    if(!name){ err.textContent = "El nombre es obligatorio."; return; }
    if(code){
      const dup = state.products.find(x=> x.code.toLowerCase() === code.toLowerCase() && x.id !== state.editing);
      if(dup){ err.textContent = `Ya existe un producto con el código "${code}".`; return; }
    }
    const num = k => { const v = $("#f_"+k).value.trim(); return v === "" ? null : Number(v); };
    const newPrice = num("price");
    const data = {
      code, name,
      brand: $("#f_brand").value.trim(),
      category: $("#f_category").value.trim(),
      size: num("size"),
      unit: $("#f_unit").value,
      price: newPrice,
      available: $("#f_available").value,
      loc: $("#f_loc").value,
      image: $("#f_image").value.trim(),
      notes: $("#f_notes").value.trim(),
    };
    const now = nowISO();
    if(editing){
      const oldPrice = editing.price;
      const priceChanged = (oldPrice !== newPrice);
      Object.assign(editing, data, { updatedAt: now });
      if(priceChanged){
        editing.priceUpdatedAt = newPrice != null ? now : null;
        toast(newPrice != null ? "Producto y precio actualizados" : "Producto actualizado (precio borrado)", "ok");
      } else {
        toast("Producto actualizado (precio sin cambios)", "ok");
      }
    } else {
      state.products.push(Object.assign({
        id: uid(), status:"draft",
        createdAt: now, updatedAt: now,
        priceUpdatedAt: newPrice != null ? now : null,
      }, data));
      toast("Producto creado (pendiente)","ok");
    }
    saveState(); go("pendientes");
  };
}

/* ==== CONFIG ==== */
function vConfig(){
  $("#m").innerHTML = `
    <h2>Configuración</h2>
    <p class="sub">Tema, importar/exportar y datos.</p>
    <div class="card">
      <h3 style="margin-top:0">🌓 Tema</h3>
      <select id="theme" style="max-width:220px">
        <option value="auto" ${state.settings.theme==="auto"?"selected":""}>Automático (sistema)</option>
        <option value="light" ${state.settings.theme==="light"?"selected":""}>Claro</option>
        <option value="dark" ${state.settings.theme==="dark"?"selected":""}>Oscuro</option>
      </select>
    </div>
    <div class="card">
      <h3 style="margin-top:0">📥 Importar</h3>
      <div class="filters">
        <label class="btn g" style="cursor:pointer">📄 Excel (.xlsx)<input type="file" id="fXlsx" accept=".xlsx,.xls" style="display:none"></label>
        <label class="btn g" style="cursor:pointer">📦 JSON<input type="file" id="fJson" accept=".json" style="display:none"></label>
        <button class="btn g" id="tryV2">♻️ Revisar datos v2</button>
      </div>
      <p class="help">Los productos importados entran como <b>pendientes</b>. Duplicados por código se omiten.</p>
    </div>
    <div class="card">
      <h3 style="margin-top:0">📤 Exportar</h3>
      <div class="filters">
        <button class="btn" id="expXlsx">📊 Excel</button>
        <button class="btn g" id="expJson">📦 JSON (respaldo)</button>
        <button class="btn g" id="expCsv">📄 CSV</button>
        <button class="btn g" id="copyJson">📋 Copiar todo (JSON)</button>
      </div>
      <p class="help">"Copiar" pone todo el JSON en el portapapeles, listo para pegar.</p>
    </div>
    <div class="card">
      <h3 style="margin-top:0">⚠️ Zona de peligro</h3>
      <div class="filters"><button class="btn r" id="wipe">🗑 Borrar todos los datos</button></div>
    </div>`;

  $("#theme").onchange = e=>{
    state.settings.theme = e.target.value;
    if(e.target.value === "auto") document.documentElement.removeAttribute("data-theme");
    else document.documentElement.setAttribute("data-theme", e.target.value);
    saveState();
  };
  $("#fXlsx").onchange = e=>{ const f = e.target.files[0]; if(!f) return; importExcel(f); e.target.value = ""; };
  $("#fJson").onchange = e=>{ const f = e.target.files[0]; if(!f) return; importJSON(f); e.target.value = ""; };
  $("#tryV2").onclick = ()=>{
    const m = tryMigrateV2();
    if(!m){ toast("No se encontraron datos v2","wn"); return; }
    confirmDlg("Importar desde v2", `Se añadirán ${m.products.length} producto(s) como pendientes.`, ()=>{
      const existCodes = new Set(state.products.map(p=> p.code.toLowerCase()));
      let added = 0;
      m.products.forEach(p=>{ if(existCodes.has(p.code.toLowerCase())) return; state.products.push(p); added++; });
      m.locations.forEach(l=>{ if(!state.locations.find(x=>x.id===l.id)) state.locations.push(l); });
      saveState(); render();
      toast(`${added} producto(s) importados`, added?"ok":"wn");
    });
  };
  $("#expXlsx").onclick = exportExcel;
  $("#expJson").onclick = exportJSON;
  $("#expCsv").onclick = exportCSV;
  $("#copyJson").onclick = async ()=>{
    const data = JSON.stringify({version:3, exportedAt:nowISO(), products:state.products, locations:state.locations}, null, 2);
    try{ await navigator.clipboard.writeText(data); toast("JSON copiado al portapapeles","ok"); }
    catch(e){
      const ta = document.createElement("textarea"); ta.value = data; document.body.appendChild(ta); ta.select();
      document.execCommand("copy"); ta.remove();
      toast("JSON copiado","ok");
    }
  };
  $("#wipe").onclick = ()=>{
    confirmDlg("Borrar todo", "Se eliminarán productos, ubicaciones y configuración. ¿Continuar?", ()=>{
      localStorage.removeItem(STORAGE_KEY);
      state.products = []; state.locations = JSON.parse(JSON.stringify(DEFAULT_LOCATIONS));
      state.selected.clear(); state.pubSelected.clear();
      saveState(); render(); toast("Datos borrados","wn");
    });
  };
}

/* ==== IMPORT/EXPORT ==== */
function exportJSON(){
  const blob = new Blob([JSON.stringify({version:3, exportedAt:nowISO(), products:state.products, locations:state.locations, settings:state.settings}, null, 2)], {type:"application/json"});
  downloadBlob(blob, `respaldo_inventario_v3_${stamp()}.json`);
  toast("Respaldo descargado","ok");
}
function importJSON(file){
  const reader = new FileReader();
  reader.onload = e=>{
    try{
      const data = JSON.parse(e.target.result);
      if(!data.products) throw new Error("Formato inválido");
      confirmDlg("Restaurar respaldo", `Se reemplazarán ${state.products.length} producto(s) por ${data.products.length}. ¿Continuar?`, ()=>{
        state.products = (data.products || []).map(normalizeProduct);
        state.locations = data.locations || JSON.parse(JSON.stringify(DEFAULT_LOCATIONS));
        state.settings = Object.assign(state.settings, data.settings || {});
        saveState(); render(); toast("Respaldo restaurado","ok");
      });
    }catch(err){ toast("Archivo JSON inválido","er"); }
  };
  reader.readAsText(file);
}
function exportCSV(){
  const head = ["Codigo","Nombre","Marca","Categoria","Tamaño","Unidad","Precio","PrecioActualizado","Hay","Ubicacion","Estado","Notas"];
  const lines = [head.join(",")];
  state.products.forEach(p=>{
    const row = [p.code,p.name,p.brand,p.category,p.size??"",p.unit,p.price??"",p.priceUpdatedAt||"",availLabel(p.available),locName(p.loc),p.status==="published"?"Publicado":"Pendiente",p.notes]
      .map(v=>`"${String(v??"").replace(/"/g,'""')}"`);
    lines.push(row.join(","));
  });
  const blob = new Blob(["\uFEFF" + lines.join("\n")], {type:"text/csv;charset=utf-8"});
  downloadBlob(blob, `inventario_${stamp()}.csv`);
  toast("CSV exportado","ok");
}
function exportExcel(){
  if(typeof XLSX === "undefined"){ toast("SheetJS no disponible","er"); return; }
  const wb = XLSX.utils.book_new();
  const all = state.products.map(p=>({
    "Código":p.code,"Nombre":p.name,"Marca":p.brand,"Categoría":p.category,
    "Tamaño":p.size??"","Unidad":p.unit,"Precio":p.price,
    "Precio actualizado":p.priceUpdatedAt?new Date(p.priceUpdatedAt).toLocaleString("es-CO"):"",
    "Días sin cambiar":p.priceUpdatedAt?daysSince(p.priceUpdatedAt):"",
    "Hay":availLabel(p.available),
    "Ubicación":locName(p.loc),"Estado":p.status==="published"?"Publicado":"Pendiente","Notas":p.notes,
  }));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(all), "Todos");
  const pub = state.products.filter(p=>p.status==="published").map(p=>({
    "Código":p.code,"Nombre":p.name,"Marca":p.brand,"Tamaño":p.size??"","Unidad":p.unit,"Precio":p.price,"Hay":availLabel(p.available),"Ubicación":locName(p.loc),
  }));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(pub), "Publicados");
  const pen = state.products.filter(p=>p.status==="draft").map(p=>({
    "Código":p.code,"Nombre":p.name,"Marca":p.brand,"Tamaño":p.size??"","Unidad":p.unit,"Precio":p.price,"Hay":availLabel(p.available),"Ubicación":locName(p.loc),
  }));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(pen), "Pendientes");
  const precios = state.products.filter(p=>p.price != null)
    .sort((a,b)=> (a.priceUpdatedAt||"").localeCompare(b.priceUpdatedAt||""))
    .map(p=>({
      "Código":p.code,"Nombre":p.name,"Marca":p.brand,"Precio":p.price,
      "Precio actualizado":p.priceUpdatedAt?new Date(p.priceUpdatedAt).toLocaleDateString("es-CO"):"",
      "Días sin cambiar":p.priceUpdatedAt?daysSince(p.priceUpdatedAt):"",
    }));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(precios), "Precios por fecha");
  const locs = state.locations.map(l=>({
    "Código":l.code,"Nombre":l.name,"Zona":l.zone,"Activa":l.active?"Sí":"No",
    "Productos":state.products.filter(p=>p.loc===l.id).length,
  }));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(locs), "Ubicaciones");
  XLSX.writeFile(wb, `inventario_${stamp()}.xlsx`);
  toast("Excel exportado","ok");
}
function importExcel(file){
  if(typeof XLSX === "undefined"){ toast("SheetJS no disponible","er"); return; }
  const reader = new FileReader();
  reader.onload = e=>{
    try{
      const wb = XLSX.read(new Uint8Array(e.target.result), {type:"array"});
      const sheet = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(sheet, {defval:""});
      if(!rows.length){ toast("Archivo vacío","wn"); return; }
      const map = detectColumns(Object.keys(rows[0]));
      if(!map.name){ toast("No se detectó la columna 'Nombre'","er"); return; }
      const parsed = rows.map(r=>{
        const get = k => map[k] ? r[map[k]] : "";
        return {
          code: String(get("code")||"").trim(),
          name: String(get("name")||"").trim(),
          brand: String(get("brand")||"").trim(),
          category: String(get("category")||"").trim(),
          size: parseNum(get("size")),
          unit: String(get("unit")||"").trim(),
          price: parseNum(get("price")),
          available: normAvail(get("available")),
          locName: String(get("loc")||"").trim(),
        };
      }).filter(r=> r.name);
      const exist = new Set(state.products.map(p=> p.code.toLowerCase()));
      const locByName = {};
      state.locations.forEach(l=> locByName[l.name.toLowerCase()] = l.id);
      confirmDlg("Importar Excel", `Se importarán ${parsed.length} producto(s) como pendientes.`, ()=>{
        let added = 0, skipped = 0;
        const now = nowISO();
        parsed.forEach(r=>{
          if(r.code && exist.has(r.code.toLowerCase())){ skipped++; return; }
          state.products.push({
            id: uid(), code: r.code, name: r.name, brand: r.brand, category: r.category,
            size: r.size, unit: r.unit, price: r.price, available: r.available,
            loc: locByName[r.locName.toLowerCase()] || "",
            image: "", notes: "", status: "draft",
            createdAt: now, updatedAt: now,
            priceUpdatedAt: r.price != null ? now : null,
          });
          added++;
        });
        saveState(); render();
        toast(`${added} importado(s)${skipped?`, ${skipped} omitido(s)`:""}`, "ok");
      });
    }catch(err){ console.error(err); toast("Error leyendo Excel: "+err.message,"er"); }
  };
  reader.readAsArrayBuffer(file);
}
function detectColumns(headers){
  const norm = s => String(s||"").toLowerCase().trim();
  const map = {};
  const rules = {
    code:["codigo","código","code","referencia","id"],
    name:["producto","nombre","name","articulo","artículo","descripcion","descripción"],
    brand:["marca","brand","empresa","fabricante"],
    category:["categoria","categoría","category","grupo","linea","línea"],
    size:["tamaño","tamano","cantidad","peso","medida","size"],
    unit:["unidad","unit"],
    price:["precio","pvp","price"],
    available:["hay","disponible","disponibilidad","stock"],
    loc:["ubicacion","ubicación","lugar","loc","zona"],
  };
  for(const h of headers){
    const n = norm(h);
    for(const [k, aliases] of Object.entries(rules)){
      if(map[k]) continue;
      if(aliases.some(a => n === a || n.startsWith(a))){ map[k] = h; break; }
    }
  }
  return map;
}
function parseNum(v){
  if(v == null || v === "") return null;
  if(typeof v === "number") return v;
  const s = String(v).replace(/[^\d.,-]/g,"").replace(/\.(?=\d{3})/g,"").replace(",", ".");
  const n = Number(s);
  return isNaN(n) ? null : n;
}
function normAvail(v){
  const s = String(v||"").toLowerCase().trim();
  if(s.includes("no")) return "no";
  if(s.includes("posib")) return "posible";
  if(s.includes("hay") || s.includes("sí") || s.includes("si") || s === "true") return "hay";
  return "hay";
}
function downloadBlob(blob, filename){
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a"); a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}
function stamp(){
  const d = new Date(); const p = n => String(n).padStart(2,"0");
  return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}`;
}

/* atajos */
document.addEventListener("keydown", e=>{
  if(e.ctrlKey || e.metaKey){
    if(e.key === "k"){ e.preventDefault(); go(state.view==="publicados"?"publicados":"pendientes"); setTimeout(()=> $("#q")?.focus(), 50); }
    if(e.key === "n"){ e.preventDefault(); go("form"); }
    if(e.key === "s" && state.view === "form"){ e.preventDefault(); $("#save")?.click(); }
  }
  if(e.key === "Escape" && $("#modal").classList.contains("on")) closeModal();
});

$$("nav button").forEach(b=> b.onclick = ()=>{
  state.editing = null; state.selected.clear(); state.pubSelected.clear();
  go(b.dataset.v);
});

loadState();
render();
